<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0f13" />
    <!-- The saved theme before the first paint (see src/theme.js): no flash of the wrong one -->
    <script>
      (function () {
        var p = 'dark';
        try { p = localStorage.getItem('gp_theme') || 'dark'; } catch (e) {}
        if (p === 'system') p = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var t = p === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='5' width='14' height='14' rx='3' fill='%237c6cff'/%3E%3Cpath d='M17 10l5-3v10l-5-3z' fill='%237c6cff'/%3E%3C/svg%3E" />
    <title>GenAI Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
