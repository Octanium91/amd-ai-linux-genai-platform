# FastFlowLM on the NPU as a service of a compose file you already have (the one that runs Ollama,
# for example): copy this directory next to that file as ./fastflowlm and paste the service.
# To run it on its own, use docker-compose.yml of this directory instead. See docs/npu.md.
services:
  fastflowlm:
    build: ./fastflowlm
    image: fastflowlm:1.0.13
    container_name: fastflowlm
    restart: unless-stopped
    ports:
      - "52625:52625"
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    ulimits:
      memlock: -1
    environment:
      - FLM_MODEL=qwen3:4b
    volumes:
      - ./flm_data:/root/.config/flm
